services:
  nest_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: e-childrenzone
    image: mariameliassaoud/e-childrenzone
    ports: 
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - db
  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: example
      POSTGRES_DB: echildrenzone
    volumes:
      - postgres-db:/var/lib/postgresql/data
  redis:
    image: redis
    volumes:
      - redis-volume:/data
  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data
    volumes:
      - minio-data:/data
volumes:
    postgres-db:
    redis-volume:
    minio-data: